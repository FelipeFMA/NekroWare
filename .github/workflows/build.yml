name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0). If set, creates a GitHub Release with NekroWare.exe attached as a raw file (no zip).'
        required: false
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: msbuild NekroWare.sln /m /p:Configuration=Release /p:Platform=x64 /v:minimal /nologo

      - name: Upload artifact (NekroWare.exe only)
        uses: actions/upload-artifact@v4
        with:
          name: NekroWare
          path: build/NekroWare.exe
          if-no-files-found: error

      - name: Create GitHub Release with raw NekroWare.exe
        if: inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: NekroWare v${{ inputs.version }}
          body: |
            Built by GitHub Actions from commit ${{ github.sha }}
          files: build/NekroWare.exe
